name: site-pages
# 資料工作只保存成果；本工作流是全站唯一的 Pages 發布者。
on:
  push:
    branches: [main]
    paths-ignore:
      - football/**
      - .github/workflows/football-data.yml
      - live/data/**
      - data/**
      - research/daily-production/auto/**
  workflow_run:
    workflows: [live-data, football-data]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
# 保留既有發布通道與環境；等待發布不再阻擋足球取數。
concurrency:
  group: site-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 取得發布資格後才選 main；不使用排隊事件的舊 checkout。
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 發布版本選擇與組合測試
        run: node --test scripts/test-site-publication.mjs
      - name: 固定本次來源並組合全站
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/site-publication.mjs prepare
      - if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site
          retention-days: 2
      - name: 部署現有全站
        id: deployment
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/deploy-pages@v4
      - name: 公開來源版本及五聯賽批次回查
        if: steps.prepare.outputs.publish == 'true'
        run: node scripts/site-publication.mjs verify

