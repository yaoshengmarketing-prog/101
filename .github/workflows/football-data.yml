name: football-data
run-name: football ${{ inputs.trigger_id || github.event_name }}
# 足球只測試、取數並保存短期快照；site-pages 統一組合及發布全站。
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/football-data.yml
      - football/scripts/**
      - football/assets/**
      - football/index.html
      - football/game.html
      - football/leagues/**
      - football/shots-preview.html
      - football/official-odds-snapshots.json
  schedule:
    # 台灣約 06:07、18:07 重建；避開 GitHub 整點排程尖峰。
    - cron: '7 10,22 * * *'
    # 賽前時窗檢查；只有開球前約 90／30 分鐘才重建，台彩快照不重抓。
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      event_id:
        description: 首次驗證或指定加列的 ESPN event ID
        required: false
        type: string
      event_league:
        description: event_id 所屬聯賽，預設 eng.1
        required: false
        type: string
      trigger_matches_json:
        description: 外部時窗同批的聯賽、賽事 ID 與 90／30 分鐘 JSON
        required: false
        type: string
      odds_snapshot_json:
        description: 人工核對後的一次性台彩官方快照 JSON（以 ESPN event ID 為鍵）
        required: false
        type: string
      trigger_id:
        description: 外部足球定時器的排定時間與目標場識別
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: football-data-producer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 判斷固定更新或賽前 90／30 分鐘時窗
        id: due
        continue-on-error: ${{ github.event_name == 'schedule' && github.event.schedule == '5,35 * * * *' }}
        env:
          FOOTBALL_SCHEDULE: ${{ github.event.schedule }}
        run: node football/scripts/football-due.mjs
      - name: 足球缺資料與配對測試
        if: steps.due.outputs.build == 'true'
        run: node --test football/scripts/test-football.mjs football/scripts/test-football-page.mjs football/scripts/test-personnel-change.mjs football/scripts/test-five-leagues.mjs cloudflare/live-data-trigger/test-football-trigger.mjs
      - name: 取數並組合五聯賽各場資料
        if: steps.due.outputs.build == 'true'
        env:
          EVENT_ID: ${{ inputs.event_id }}
          EVENT_LEAGUE: ${{ inputs.event_league }}
          TRIGGER_ID: ${{ inputs.trigger_id }}
          TRIGGER_MATCHES_JSON: ${{ inputs.trigger_matches_json || steps.due.outputs.matches_json }}
          ODDS_SNAPSHOT_JSON: ${{ inputs.odds_snapshot_json }}
        run: |
          if [ -n "$ODDS_SNAPSHOT_JSON" ]; then
            mkdir -p .football-build
            printf '%s' "$ODDS_SNAPSHOT_JSON" > .football-build/official-odds.json
            export ODDS_FILE=.football-build/official-odds.json
          fi
          node football/scripts/build-five-leagues.mjs --out .football-build/data
      - name: 更新失敗時保存明確狀態
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = '.football-build/data', now = new Date();
          const common = { status: 'failed', generatedAt: now.toISOString(),
            expiresAt: new Date(now.getTime() + 7200000).toISOString(),
            reason: '本次足球取數或 QA 失敗；未回退舊快照', runId: process.env.GITHUB_RUN_ID };
          fs.rmSync(root, { recursive: true, force: true });
          const leagues = {};
          for (const league of ['eng.1', 'esp.1', 'ger.1', 'ita.1', 'fra.1']) {
            const dir = league === 'eng.1' ? root : `${root}/leagues/${league}`;
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(`${dir}/status.json`, JSON.stringify({ ...common, league, gameIds: [], gameCount: 0 }) + '\n');
            leagues[league] = { status: 'failed', generatedAt: common.generatedAt, gameIds: [], gameCount: 0 };
          }
          fs.writeFileSync(`${root}/manifest.json`, JSON.stringify({ ...common, leagues, gameCount: 0 }) + '\n');
          NODE
      - name: 記錄快照來源版本
        if: always() && (steps.due.outputs.build == 'true' || failure())
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          fs.mkdirSync('.football-build/data', { recursive: true });
          fs.writeFileSync('.football-build/data/snapshot-source.json', JSON.stringify({
            schemaVersion: 1,
            repository: process.env.GITHUB_REPOSITORY,
            workflow: '.github/workflows/football-data.yml',
            branch: process.env.GITHUB_REF_NAME,
            sourceSha: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)
          }) + '\n');
          NODE
      - name: 保留本次短期快照供部署與查核
        if: always() && (steps.due.outputs.build == 'true' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: football-current
          path: .football-build/data/
          retention-days: 2
          if-no-files-found: error

