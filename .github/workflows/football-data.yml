name: football-data
# 足球每次重建為短期快照，直接部署 Pages，不把例行 JSON 寫進 Git。
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/football-data.yml
      - football/scripts/**
      - football/assets/**
      - football/index.html
      - football/game.html
      - football/official-odds-snapshots.json
  schedule:
    # 試行：台灣 06:00、18:00 各重建一次；18 小時後畫面自動標逾期。
    - cron: '0 10,22 * * *'
  workflow_dispatch:
    inputs:
      event_id:
        description: 首次驗證或指定加列的英超 ESPN event ID
        required: false
        type: string
      odds_snapshot_json:
        description: 人工核對後的一次性台彩官方快照 JSON（以 ESPN event ID 為鍵）
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: site-pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 足球缺資料與配對測試
        run: node --test football/scripts/test-football.mjs
      - name: 取數並組合各場英超資料
        env:
          EVENT_ID: ${{ inputs.event_id }}
          ODDS_SNAPSHOT_JSON: ${{ inputs.odds_snapshot_json }}
        run: |
          args=(--out .football-build/data)
          if [ -n "$EVENT_ID" ]; then args+=(--event "$EVENT_ID"); fi
          if [ -n "$ODDS_SNAPSHOT_JSON" ]; then
            mkdir -p .football-build
            printf '%s' "$ODDS_SNAPSHOT_JSON" > .football-build/official-odds.json
            args+=(--odds-file .football-build/official-odds.json)
          fi
          node football/scripts/build-football.mjs "${args[@]}"
      - name: 足球各場資料 QA
        run: node football/scripts/qa-football.mjs .football-build/data
      - name: 更新失敗時發布明確狀態
        if: failure()
        run: |
          mkdir -p .football-build/data
          node --input-type=module -e "import fs from 'node:fs'; const now=new Date(); fs.writeFileSync('.football-build/data/status.json', JSON.stringify({status:'failed',generatedAt:now.toISOString(),expiresAt:new Date(now.getTime()+7200000).toISOString(),reason:'本次足球取數或 QA 失敗；未回退舊快照',runId:process.env.GITHUB_RUN_ID})+'\n');"
          rm -f .football-build/data/overview.json .football-build/data/run-report.json
          rm -rf .football-build/data/games
      - name: 保留本次短期快照供部署與查核
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-current
          path: .football-build/data/
          retention-days: 2
          if-no-files-found: error
  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: football-current
          path: .football-publish
      - name: 組合既有全站與本次足球快照
        run: |
          mkdir -p .site
          tar --exclude='./.git' --exclude='./.github' --exclude='./.site' --exclude='./.football-publish' --exclude='./football/data' -cf - . | tar -xf - -C .site
          mkdir -p .site/football/data
          cp -a .football-publish/. .site/football/data/
          touch .site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
          retention-days: 2
      - name: 部署到現有 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 公開頁資料時間回查
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = JSON.parse(fs.readFileSync('.football-publish/status.json', 'utf8'));
          const url = `https://yaoshengmarketing-prog.github.io/101/football/data/status.json?run=${process.env.RUN_ID}`;
          for (let attempt = 0; attempt < 20; attempt++) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              if (response.ok) {
                const live = await response.json();
                if (live.generatedAt === expected.generatedAt && live.status === expected.status) {
                  console.log(JSON.stringify({ publicUrl: url, generatedAt: live.generatedAt, status: live.status, gameIds: live.gameIds || [] }));
                  process.exit(0);
                }
              }
            } catch (error) { console.log(`回查重試 ${attempt + 1}: ${error.message}`); }
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error(`公開頁尚未顯示本次快照 ${expected.generatedAt}`);
          NODE
