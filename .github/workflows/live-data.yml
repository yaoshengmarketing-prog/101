name: live-data
# 從 MLB 官方 StatsAPI 更新 /live/ 試營運資料（台灣時間今天＋明天）＋每場牛棚近期使用
# 排程（UTC）：台灣 21:00–11:59 每 30 分鐘（官方打線、先發異動、雙重賽 G1 牛棚補進 G2 都在這段時間）；
#   台灣 14:07、17:07、20:07 各一次。00:07 在密集時段內，換日後很快換上新的一天。也可手動觸發。
# 資料沒有變動就不 commit（scripts/data-changed.mjs，忽略時間戳）。
# 很久沒更新：每次開始時 scripts/watch.mjs 查距上次成功多久，超過 6 小時 → 開 issue（@ 站長，寄信）。GitHub 排程晚一兩小時屬常見，不通知。
# 啟動後失敗：live/ 還原成上一版、status.json 記下失敗（網頁紅色警示）、job 標紅、開 issue「自動更新失敗」。
# 恢復：下一次成功的 run 在 issue 留言並關閉。
# 外部觸發：Cloudflare Worker（cloudflare/live-data-trigger）台灣 21:00–11:45 每 15 分鐘用 workflow_dispatch 觸發，
#   run 名稱帶觸發編號（live-data cf 2026-09-24T13:15Z）；紀錄在 CF_LOG，每次有資料變動時一起存成 data/cf-trigger-log.json。
# 兩種觸發並存：concurrency 同時只跑一個、最多一個排隊；新的排隊會取代舊的排隊（舊的顯示 cancelled），
#   每次都以自己開始的時間抓資料，所以不會用舊資料蓋掉新資料，也不補跑過期的檢查。
run-name: live-data ${{ inputs.trigger || github.event_name }}
on:
  schedule:
    - cron: '7,37 0-3,13-23 * * *'
    - cron: '7 6,9,12 * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: 外部觸發編號（Cloudflare 自動填；手動執行留空）
        required: false
        type: string
permissions:
  contents: write
  issues: write
  actions: read
env:
  CF_LOG: https://live-data-trigger.yaosheng-marketing.workers.dev/log
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 取「開始跑的那一刻」的 main 最新版，不是觸發當下的版本：排隊等前一個 run 時，前一個可能已經推了新資料
      # （2026-09-25 01:01 run 36031388985 就是拿到舊版，和前一個 run 的資料衝突，commit 失敗）
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 更新間隔檢查（超過 6 小時才通知）
        run: node scripts/watch.mjs gap
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 離線測試（牛棚、單場抓取失敗沿用舊值、情境卡）
        id: test
        run: node scripts/test-bullpen.mjs && node scripts/test-build-live.mjs && node scripts/test-ctx.mjs
      - name: build（抓取＋標準化，寫到 .build）
        id: build
        run: node scripts/build-live.mjs .build
      - name: 牛棚（每場本場之前的逐投手、逐日使用）
        id: bullpen
        run: node scripts/bullpen.mjs .build
      - name: 情境卡（賽前計算，開賽後凍結）
        id: ctx
        run: node scripts/ctx.mjs .build
      - name: 賽後結果（補最終比分、逐局、牛棚實際使用；失敗不擋當次資料）
        id: post
        continue-on-error: true
        run: node scripts/post.mjs .build
      - name: QA
        id: qa
        run: node scripts/qa-live.mjs .build
      - name: publish（QA 通過才覆蓋 live/data；資料沒變動就不 commit）
        id: publish
        run: |
          mkdir -p live/data data research/daily-production/auto
          cp -r .build/live-data/. live/data/
          cp .build/state.json data/state.json
          cat .build/events.jsonl >> data/events.jsonl
          cat .build/report.md .build/qa.md >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --max-time 20 "$CF_LOG" -o .build/cf.json && mv .build/cf.json data/cf-trigger-log.json || echo "::warning::讀不到 Cloudflare 觸發紀錄"
          rc=0; node scripts/data-changed.mjs .build || rc=$?
          if [ $rc = 0 ]; then
            node scripts/live-status.mjs ok
            D=$(TZ=Asia/Taipei date +%F); T=$(TZ=Asia/Taipei date +%H%M)
            cat .build/report.md .build/qa.md > research/daily-production/auto/$D-$T.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ $rc = 10 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "資料沒有變動：不 commit（本次紀錄只留在 Actions run）" | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- live data && git clean -fdq live data
          else
            exit $rc
          fi
      # 本次判定留在 run 的步驟紀錄裡（Actions 讀權限即可查）：哪一個步驟是 success、另一個是 skipped
      # Cloudflare Worker 補查 run 時會讀這兩個步驟，記成 result＝changed／unchanged
      - name: 判定：資料有變動（提交）
        if: steps.publish.outputs.changed == 'true'
        run: echo "本次資料有變動，接著 commit"
      - name: 判定：資料沒有變動（成功檢查，不提交）
        if: steps.publish.outputs.changed == 'false'
        run: echo "本次資料沒有變動：抓取與 QA 都成功，不需要 commit"
      - name: 失敗時只寫報告，保留上一版公開資料
        if: failure()
        run: |
          mkdir -p research/daily-production/errors
          D=$(TZ=Asia/Taipei date +%F-%H%M)
          { echo "# 失敗 run ${{ github.run_id }}"; cat .build/report.md .build/qa.md 2>/dev/null; } > research/daily-production/errors/$D.md
          git checkout -- live 2>/dev/null || true
          git clean -fdq live 2>/dev/null || true
          node scripts/live-status.mjs fail "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} bullpen=${{ steps.bullpen.outcome }} ctx=${{ steps.ctx.outcome }} qa=${{ steps.qa.outcome }}"
          cat research/daily-production/errors/$D.md >> "$GITHUB_STEP_SUMMARY"
          node scripts/watch.mjs fail "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} bullpen=${{ steps.bullpen.outcome }} ctx=${{ steps.ctx.outcome }} qa=${{ steps.qa.outcome }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit
        id: commit
        if: always()
        run: |
          git config user.name "live-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/daily-production
          git add -A live/data data 2>/dev/null || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "live data $(TZ=Asia/Taipei date '+%m/%d %H:%M') run ${{ github.run_id }}"
          git pull --rebase && git push
      - name: 恢復通知（關閉還開著的間隔／失敗 issue）
        if: success()
        run: node scripts/watch.mjs ok
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: commit／push 失敗通知
        if: failure() && steps.commit.outcome == 'failure'
        run: node scripts/watch.mjs fail "commit/push 失敗（資料已產生但沒推上 GitHub）"
        env:
          GITHUB_TOKEN: ${{ github.token }}
