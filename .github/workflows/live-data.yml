name: live-data
# 從 MLB 官方 StatsAPI 更新 /live/ 試營運資料（台灣時間今天＋明天）＋每場牛棚近期使用
# 排程：每 3 小時（UTC 每 3 小時的第 7 分＝台灣 02:07、05:07、08:07、11:07、14:07、17:07、20:07、23:07）；也可手動觸發。
# 失敗時：live/ 還原成上一版、status.json 記下失敗（網頁會顯示警示）、job 標紅（GitHub 通知）。
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 牛棚離線測試
        id: test
        run: node scripts/test-bullpen.mjs
      - name: build（抓取＋標準化，寫到 .build）
        id: build
        run: node scripts/build-live.mjs .build
      - name: 牛棚（每場本場之前的逐投手、逐日使用）
        id: bullpen
        run: node scripts/bullpen.mjs .build
      - name: QA
        id: qa
        run: node scripts/qa-live.mjs .build
      - name: publish（QA 通過才覆蓋 live/data）
        run: |
          mkdir -p live/data data research/daily-production/auto
          cp -r .build/live-data/. live/data/
          cp .build/state.json data/state.json
          cat .build/events.jsonl >> data/events.jsonl
          node scripts/live-status.mjs ok
          D=$(TZ=Asia/Taipei date +%F); T=$(TZ=Asia/Taipei date +%H%M)
          cat .build/report.md .build/qa.md > research/daily-production/auto/$D-$T.md
          cat .build/report.md .build/qa.md >> "$GITHUB_STEP_SUMMARY"
      - name: 失敗時只寫報告，保留上一版公開資料
        if: failure()
        run: |
          mkdir -p research/daily-production/errors
          D=$(TZ=Asia/Taipei date +%F-%H%M)
          { echo "# 失敗 run ${{ github.run_id }}"; cat .build/report.md .build/qa.md 2>/dev/null; } > research/daily-production/errors/$D.md
          git checkout -- live 2>/dev/null || true
          git clean -fdq live 2>/dev/null || true
          node scripts/live-status.mjs fail "test=${{ steps.test.outcome }} build=${{ steps.build.outcome }} bullpen=${{ steps.bullpen.outcome }} qa=${{ steps.qa.outcome }}"
          cat research/daily-production/errors/$D.md >> "$GITHUB_STEP_SUMMARY"
      - name: commit
        if: always()
        run: |
          git config user.name "live-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/daily-production
          git add -A live/data data 2>/dev/null || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "live data $(TZ=Asia/Taipei date '+%m/%d %H:%M') run ${{ github.run_id }}"
          git pull --rebase && git push
